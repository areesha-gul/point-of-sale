services:
  - type: web
    name: pos-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run init-db
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/backend/database/pos.db
      - key: FRONTEND_URL
        value: https://your-frontend-url.vercel.app
      - key: NODE_VERSION
        value: 20.18.1
